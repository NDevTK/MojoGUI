<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MojoGUI Sandbox</title>
    <style>
        body {
            background-color: #0f172a;
            /* matches index.css dark theme */
            color: #94a3b8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .status {
            padding: 20px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            text-align: center;
        }

        h2 {
            color: #38bdf8;
            margin-top: 0;
        }

        .log {
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="status">
        <h2>Mojo Sandbox Active</h2>
        <p>Listening for commands from Parent Window...</p>
        <div id="log" class="log">Waiting for execution...</div>
    </div>

    <!-- Inject dependencies if needed, or rely on Parent to send self-contained code -->
    <!-- Ideally, we might want bindings here. For now, we assume the parent sends code that includes necessary setup or we inject generic bindings. 
         Actually, the previous plan said "Inject standard MojoGUI scripts". 
         But since this is a separate file, we should link them. -->
    <script src="bindings/index.js"></script>
    <!-- We might need specific bindings for LocalFrameHost if we want to test it easily -->
    <!-- For now, we will rely on the bindings loader or manual injection from parent -->

    <script>
        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.textContent = msg;
            console.log('[Sandbox]', msg);
        }

        window.addEventListener('message', async (event) => {
            // Security: Strict Origin Check
            if (event.origin !== window.location.origin) {
                console.warn('[Sandbox] Blocked message from unknown origin:', event.origin);
                return;
            }

            const { type, code } = event.data;

            if (type === 'EXECUTE') {
                log('Executing received code...');
                try {
                    // We use a Function constructor to execute in global scope
                    // but we might want to wrap in an async function
                    const func = new Function('mojo', 'blink', 'console', `
                        return (async () => {
                            try {
                                ${code}
                            } catch(err) {
                                console.error('[Sandbox Execution Error]', err);
                                throw err;
                            }
                        })();
                    `);

                    // Execute with access to window.mojo (if loaded)
                    await func(window.mojo, window.blink, console);
                    log('Execution successful.');

                    // Acknowledge success
                    event.source.postMessage({ type: 'EXECUTION_SUCCESS' }, event.origin);

                } catch (err) {
                    log('Execution failed: ' + err.message);
                    event.source.postMessage({ type: 'EXECUTION_ERROR', error: err.message }, event.origin);
                }
            } else if (type === 'PING') {
                event.source.postMessage({ type: 'PONG' }, event.origin);
            }
        });

        // Notify parent we are ready
        if (window.opener) {
            window.opener.postMessage({ type: 'SANDBOX_READY' }, window.location.origin);
        }
    </script>
</body>

</html>
