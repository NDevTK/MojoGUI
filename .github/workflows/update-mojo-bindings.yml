name: Update Mojo JS Bindings

on:
  schedule:
    - cron: "0 10 * * *" # Daily at 10:00 UTC (matches Canary release timing)
  workflow_dispatch: # Manual trigger
    inputs:
      chromium_version:
        description: 'Chromium version tag (e.g. 120.0.6099.109) or "canary"'
        required: true
        default: "canary"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-mojo-bindings.yml"
      - "generate_bindings.py"

permissions:
  contents: write

jobs:
  update-bindings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Chromium Version
        id: resolve-version
        run: |
          VERSION="${{ github.event.inputs.chromium_version }}"
          if [ "$VERSION" == "canary" ] || [ -z "$VERSION" ]; then
            echo "Resolving latest Canary version..."
            # Fetch latest Windows Canary version
            JSON=$(curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Canary&platform=Windows&num=1")
            # Extract version using python since it is already setup
            VERSION=$(python3 -c "import sys, json; print(json.loads(sys.argv[1])[0]['version'])" "$JSON")
            echo "Resolved Canary to: $VERSION"
          fi
          echo "TARGET_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Save previous index.json for security diff
        run: |
          if [ -f bindings/index.json ]; then
            cp bindings/index.json /tmp/index_old.json
            echo "HAS_OLD_INDEX=true" >> $GITHUB_ENV
          else
            echo "HAS_OLD_INDEX=false" >> $GITHUB_ENV
          fi

      - name: Create working directories
        run: |
          mkdir -p chromium_src
          mkdir -p bindings

      - name: Sparse checkout .mojom files from Chromium
        run: |
          cd chromium_src
          git init
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git config core.sparseCheckout true

          # Get .mojom files, BUILD.gn for scrambling detection, chrome/VERSION for salt,
          # and binder source files for usage analysis + security gate extraction
          cat > .git/info/sparse-checkout << 'EOF'
          mojo/public/
          **/*.mojom
          **/BUILD.gn
          chrome/VERSION
          content/browser/browser_interface_binders.cc
          content/browser/renderer_host/render_process_host_impl_receiver_bindings.cc
          chrome/browser/chrome_browser_interface_binders.cc
          chrome/browser/extensions/chrome_extensions_browser_interface_binders.cc
          components/performance_manager/binders.cc
          content/browser/renderer_host/render_process_host_impl.h
          chrome/browser/chrome_content_browser_client_receiver_bindings.cc
          extensions/browser/extensions_browser_interface_binders.cc
          chrome/browser/extensions/chrome_content_browser_client_extensions_part_bindings.cc
          chrome/browser/chrome_browser_interface_binders_webui.cc
          chrome/browser/chrome_browser_interface_binders_webui_parts_desktop.cc
          chrome/browser/chrome_browser_interface_binders_webui_parts_android.cc
          chrome/browser/chrome_browser_interface_binders_webui_parts_chromeos.cc
          chrome/browser/chrome_browser_interface_binders_webui_parts_features.cc
          android_webview/browser/aw_content_browser_client_receiver_bindings.cc
          content/browser/renderer_host/render_frame_host_impl_interface_binders.cc
          content/browser/renderer_host/render_frame_host_impl.cc
          EOF

          git pull --depth=1 origin main || git pull --depth=1 origin master
          if [ ! -z "$TARGET_VERSION" ]; then
            echo "Switching to tag: $TARGET_VERSION"
            git fetch --depth=1 origin refs/tags/$TARGET_VERSION:refs/tags/$TARGET_VERSION
            git checkout $TARGET_VERSION
          fi

      - name: Create stub mojoms for generated files
        run: |
          # These mojoms are generated at build time in Chromium and thus missing from source tree.
          # We create stubs so that other mojoms importing them can resolve their types.

          mkdir -p chromium_src/third_party/blink/public/mojom/runtime_feature_state
          cat > chromium_src/third_party/blink/public/mojom/runtime_feature_state/runtime_feature.mojom << 'EOF'
          module blink.mojom;
          enum RuntimeFeature {
            kDummyFeature,
          };
          EOF

          echo "Created stub mojoms"

      - name: List .mojom files
        run: |
          # Finds all .mojom files in chromium_src
          # We sort them to help with stability, though dependencies matter more
          find chromium_src -name "*.mojom" | sort > mojom_files.txt

          echo "Found $(wc -l < mojom_files.txt) .mojom files"
          head -10 mojom_files.txt

      - name: Generate Mojo JS bindings
        run: |
          echo "Generating Mojo JS bindings..."

          # Set up paths
          export PYTHONPATH="$PYTHONPATH:$(pwd)/chromium_src"

          # Directory for bindings
          mkdir -p bindings
          # Run the generation script
          CHROMIUM_VERSION="${{ env.TARGET_VERSION }}" python generate_bindings.py

      - name: Generate security diff report
        if: env.HAS_OLD_INDEX == 'true'
        run: |
          python3 << 'PYEOF'
          import json, os, sys, re
          from datetime import datetime

          old_path = "/tmp/index_old.json"
          new_path = "bindings/index.json"

          with open(old_path, 'r') as f:
              old_data = json.load(f)
          with open(new_path, 'r') as f:
              new_data = json.load(f)

          old_ifaces = {i['module'] + '.' + i['name']: i for i in old_data.get('interfaces', [])}
          new_ifaces = {i['module'] + '.' + i['name']: i for i in new_data.get('interfaces', [])}

          old_keys = set(old_ifaces.keys())
          new_keys = set(new_ifaces.keys())

          added = sorted(new_keys - old_keys)
          removed = sorted(old_keys - new_keys)

          # Risk scoring for security diff (mirrors js/awards.js scoring logic)
          METHOD_RISK_PATTERNS = [
              (r'^(Write|Send|Push|Transmit|Control)', 2, 'write-primitive'),
              (r'^(Open|Create|Install|Execute|Run|Launch)', 2, 'instantiation'),
              (r'(Unsanitized|Unsafe|Raw|Arbitrary)', 3, 'unsanitized'),
              (r'(File|Path|Directory|FileDescriptor)', 2, 'fs-access'),
              (r'(Socket|Port|Connect|Tcp|Udp)', 2, 'network'),
              (r'(Deserialize|Parse|Decode|Compile|Wasm)', 2, 'parser'),
              (r'(Navigate|Load|Redirect|Commit|Origin)', 1, 'navigation'),
              (r'^(Register|Bind|Attach|Mount)', 1, 'lifecycle'),
              (r'^(Delete|Remove|Drop|Clear|Reset)', 1, 'destructive'),
              (r'(Transfer|Stream|Data|Buffer|Blob|Chunk)', 1, 'data-flow'),
          ]
          DOMAIN_RISK_PATTERNS = [
              (r'\b(usb|hid|serial|nfc|smart_card|midi|bluetooth)\b', 3, 'hardware'),
              (r'\b(direct_socket|tcp_socket|udp_socket)\b', 3, 'raw-network'),
              (r'\b(file_system|file_backed|clipboard)\b', 2, 'fs/clipboard'),
              (r'\b(ai_manager|webnn|translation|handwriting|speech_recogn|screen_ai)\b', 2, 'ai/ml'),
              (r'\b(shared_storage|fenced_frame|attribution|interest_group)\b', 2, 'privacy-sandbox'),
              (r'\b(print|pdf|media|codec|video|audio|renderer)\b', 1, 'media/parsing'),
          ]

          def score_interface(iface):
              meta = iface.get('metadata', {})
              category = meta.get('category', 'internal')
              scope = meta.get('scope', 'context')
              gates = meta.get('gates', [])
              methods = iface.get('methods', [])
              name = iface.get('name', '')
              module = iface.get('module', '')
              module_name = module + ' ' + name

              score = 0
              tags = []

              # Category score
              if category == 'direct': score += 3
              elif category == 'associated': score += 2

              # Domain risk
              for pattern, weight, label in DOMAIN_RISK_PATTERNS:
                  if re.search(pattern, module_name, re.IGNORECASE):
                      score += weight
                      tags.append(label)

              # Method risk
              for m in methods:
                  for pattern, weight, label in METHOD_RISK_PATTERNS:
                      if re.search(pattern, m, re.IGNORECASE):
                          score += weight
                          if label not in tags: tags.append(label)
                          break

              # Attack surface
              if len(methods) >= 10: score += 2
              elif len(methods) >= 5: score += 1

              # No security gates
              if not gates and category in ('direct', 'associated'):
                  score += 2

              # Process scope
              if scope == 'process': score += 1

              return score, tags

          # Detect method changes on existing interfaces
          changed = []
          for fqn in sorted(old_keys & new_keys):
              old_methods = set(old_ifaces[fqn].get('methods', []))
              new_methods = set(new_ifaces[fqn].get('methods', []))
              added_methods = sorted(new_methods - old_methods)
              removed_methods = sorted(old_methods - new_methods)

              old_cat = old_ifaces[fqn].get('metadata', {}).get('category', 'unknown')
              new_cat = new_ifaces[fqn].get('metadata', {}).get('category', 'unknown')
              cat_changed = old_cat != new_cat

              old_gates = old_ifaces[fqn].get('metadata', {}).get('gates', [])
              new_gates = new_ifaces[fqn].get('metadata', {}).get('gates', [])
              gates_changed = set(old_gates) != set(new_gates)

              if added_methods or removed_methods or cat_changed or gates_changed:
                  entry = {'interface': fqn, 'category': new_cat}
                  if added_methods:
                      entry['methods_added'] = added_methods
                  if removed_methods:
                      entry['methods_removed'] = removed_methods
                  if cat_changed:
                      entry['category_change'] = f"{old_cat} -> {new_cat}"
                  if gates_changed:
                      entry['gates_added'] = sorted(set(new_gates) - set(old_gates))
                      entry['gates_removed'] = sorted(set(old_gates) - set(new_gates))
                  # Score the changed interface for priority sorting
                  risk_score, risk_tags = score_interface(new_ifaces[fqn])
                  entry['risk_score'] = risk_score
                  if risk_tags:
                      entry['risk_tags'] = risk_tags
                  changed.append(entry)

          # Sort changed by risk score descending
          changed.sort(key=lambda x: x.get('risk_score', 0), reverse=True)

          version = os.environ.get('TARGET_VERSION', 'unknown')
          report = {
              'version': version,
              'generated_at': datetime.utcnow().isoformat() + 'Z',
              'old_interface_count': len(old_keys),
              'new_interface_count': len(new_keys),
              'summary': {
                  'interfaces_added': len(added),
                  'interfaces_removed': len(removed),
                  'interfaces_changed': len(changed),
              },
              'added': [],
              'removed': removed,
              'changed': changed,
          }

          # Enrich added interfaces with their metadata and risk score
          for fqn in added:
              iface = new_ifaces[fqn]
              risk_score, risk_tags = score_interface(iface)
              entry = {
                  'interface': fqn,
                  'methods': iface.get('methods', []),
                  'category': iface.get('metadata', {}).get('category', 'unknown'),
                  'scope': iface.get('metadata', {}).get('scope', 'unknown'),
                  'risk_score': risk_score,
              }
              if risk_tags:
                  entry['risk_tags'] = risk_tags
              gates = iface.get('metadata', {}).get('gates', [])
              if gates:
                  entry['gates'] = gates
              report['added'].append(entry)

          # Sort added by risk score descending (highest priority first)
          report['added'].sort(key=lambda x: x.get('risk_score', 0), reverse=True)

          # Write report
          os.makedirs('security-reports', exist_ok=True)
          report_path = f"security-reports/diff_{version.replace('.', '_')}.json"
          with open(report_path, 'w') as f:
              json.dump(report, f, indent=2)

          # Also write a human-readable summary
          summary_path = f"security-reports/diff_{version.replace('.', '_')}.md"
          with open(summary_path, 'w') as f:
              f.write(f"# Security Diff Report: {version}\n\n")
              f.write(f"Generated: {report['generated_at']}\n\n")
              f.write(f"| Metric | Count |\n|--------|-------|\n")
              f.write(f"| Total interfaces (old) | {len(old_keys)} |\n")
              f.write(f"| Total interfaces (new) | {len(new_keys)} |\n")
              f.write(f"| Interfaces added | {len(added)} |\n")
              f.write(f"| Interfaces removed | {len(removed)} |\n")
              f.write(f"| Interfaces with method changes | {len(changed)} |\n\n")

              if report['added']:
                  f.write("## New Interfaces\n\n")
                  f.write("Sorted by risk score (highest first).\n\n")
                  for entry in report['added']:
                      score = entry.get('risk_score', 0)
                      cat_badge = f"[{entry['category']}]"
                      score_badge = f"(score: {score})" if score >= 5 else ""
                      tags_str = ""
                      if entry.get('risk_tags'):
                          tags_str = " | Tags: " + ", ".join(entry['risk_tags'])
                      gates_str = ""
                      if entry.get('gates'):
                          gates_str = " | Gates: " + ", ".join(entry['gates'])
                      # Highlight high-risk additions
                      prefix = "🔴 " if score >= 9 else ("🟠 " if score >= 7 else ("🟡 " if score >= 5 else ""))
                      f.write(f"- {prefix}**{entry['interface']}** {cat_badge} {score_badge}{tags_str}{gates_str}\n")
                      if entry.get('methods'):
                          for m in entry['methods'][:10]:
                              f.write(f"  - `{m}`\n")
                          if len(entry['methods']) > 10:
                              f.write(f"  - ... and {len(entry['methods']) - 10} more\n")
                  f.write("\n")

              if removed:
                  f.write("## Removed Interfaces\n\n")
                  for fqn in removed:
                      f.write(f"- ~~{fqn}~~\n")
                  f.write("\n")

              if changed:
                  f.write("## Changed Interfaces\n\n")
                  f.write("Sorted by risk score (highest first).\n\n")
                  for entry in changed:
                      score = entry.get('risk_score', 0)
                      score_badge = f"(score: {score})" if score >= 5 else ""
                      f.write(f"### {entry['interface']} [{entry.get('category', '?')}] {score_badge}\n")
                      if 'category_change' in entry:
                          f.write(f"- **Category changed: {entry['category_change']}**\n")
                      if entry.get('methods_added'):
                          f.write(f"- Methods added: {', '.join('`' + m + '`' for m in entry['methods_added'])}\n")
                      if entry.get('methods_removed'):
                          f.write(f"- Methods removed: {', '.join('~~`' + m + '`~~' for m in entry['methods_removed'])}\n")
                      if entry.get('gates_added'):
                          f.write(f"- Gates added: {', '.join(entry['gates_added'])}\n")
                      if entry.get('gates_removed'):
                          f.write(f"- Gates removed: {', '.join(entry['gates_removed'])}\n")
                      if entry.get('risk_tags'):
                          f.write(f"- Risk tags: {', '.join(entry['risk_tags'])}\n")
                      f.write("\n")

          # Print summary to stdout
          print(f"\n{'='*60}")
          print(f"SECURITY DIFF: {version}")
          print(f"{'='*60}")
          print(f"Interfaces added:   {len(added)}")
          print(f"Interfaces removed: {len(removed)}")
          print(f"Interfaces changed: {len(changed)}")
          if added:
              direct_added = [a for a in report['added'] if a['category'] == 'direct']
              high_risk = [a for a in report['added'] if a.get('risk_score', 0) >= 5]
              print(f"  -> {len(direct_added)} new DIRECT interfaces (renderer-accessible)")
              print(f"  -> {len(high_risk)} high-risk new interfaces (score >= 5)")
          if changed:
              high_risk_changed = [c for c in changed if c.get('risk_score', 0) >= 5]
              print(f"  -> {len(high_risk_changed)} high-risk changed interfaces (score >= 5)")
          print(f"Reports: {report_path}, {summary_path}")
          print(f"{'='*60}")

          # Set output for step summary
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(f"## Security Diff: {version}\n")
              f.write(f"- **{len(added)}** interfaces added")
              if added:
                  direct_added = [a for a in report['added'] if a['category'] == 'direct']
                  high_risk = [a for a in report['added'] if a.get('risk_score', 0) >= 5]
                  f.write(f" ({len(direct_added)} direct, {len(high_risk)} high-risk)")
              f.write(f"\n- **{len(removed)}** interfaces removed\n")
              f.write(f"- **{len(changed)}** interfaces changed\n")
              if changed:
                  high_risk_changed = [c for c in changed if c.get('risk_score', 0) >= 5]
                  if high_risk_changed:
                      f.write(f"  - {len(high_risk_changed)} high-risk changes\n")

          PYEOF

      - name: Upload security diff report
        if: env.HAS_OLD_INDEX == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-diff-report
          path: security-reports/
          retention-days: 90
        continue-on-error: true

      - name: Cleanup temporary files
        run: |
          # Remove all temporary files that should NOT be committed
          rm -rf chromium_src/
          rm -f mojom_files.txt
          rm -rf security-reports/
          echo "Cleaned up temporary files"

      - name: Commit only generated binding files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only add generated binding files - NOT core runtime files
          # Core files (bindings_lite.js, interface_support.js, etc.) should not be modified
          git add bindings/*.mojom.js
          git add bindings/index.json

          # Show what will be committed
          echo "Files staged for commit:"
          git diff --staged --name-only

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            CHANGED_COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "Update Mojo JS bindings - $(date -u +%Y-%m-%d) [$CHANGED_COUNT files]"
            git push
          fi
